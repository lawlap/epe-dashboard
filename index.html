const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(D.salt),iterations:D.iter,hash:'SHA-256'},base,256));
}
async function decrypt(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},k,b64(D.ct)));
}
// replace the lock page only once it has finished loading; a write during parsing would nest the dashboard inside it
function show(html){ const go=()=>{ document.open(); document.write(html); document.close(); };
  document.readyState==='complete' ? go() : addEventListener('load', ()=>setTimeout(go, 0), {once:true}); }
(async()=>{
  let saved=null; try{ saved=localStorage.getItem('epeKey'); }catch(e){}
  if(saved){ try{ show(await decrypt(b64(saved))); return; }catch(e){ try{ localStorage.removeItem('epeKey'); }catch(_){} } }
  document.body.classList.add('ready');
})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault(); const err=document.getElementById('err'); err.textContent='Opening…';
  try{ const raw=await derive(document.getElementById('pw').value); const html=await decrypt(raw);
       try{ localStorage.setItem('epeKey',btoa(String.fromCharCode(...raw))); }catch(e){}
       show(html);
  }catch(e){ err.textContent='Wrong password'; }
});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
